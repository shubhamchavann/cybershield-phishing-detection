{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper reveal">
    <div class="panel auth-card purple-glow-border">
        <div class="auth-header text-center">
            <span class="auth-icon"><i data-lucide="user-plus"></i></span>
            <h2>Create Security Account</h2>
            <p class="card-text mt-10">Sign up to associate your threat scanner checks with a persistent account.</p>
        </div>

        {% if error %}
            <div class="error-banner mt-20">
                <i data-lucide="alert-triangle"></i>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('signup') }}" class="auth-form mt-25">
            <div class="form-group mb-20">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <i data-lucide="mail" class="field-icon"></i>
                    <input type="email" id="email" name="email" placeholder="agent@phishguard.security" required autocomplete="email">
                </div>
            </div>

            <div class="form-group mb-20">
                <label for="password" class="form-label">Account Password</label>
                <div class="input-wrapper">
                    <i data-lucide="lock" class="field-icon"></i>
                    <input type="password" id="password" name="password" placeholder="Min. 8 characters" required autocomplete="new-password">
                </div>
            </div>

            <div class="form-group mb-20">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <div class="input-wrapper">
                    <i data-lucide="shield-check" class="field-icon"></i>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-full mt-10">
                <i data-lucide="user-plus"></i> Create Account
            </button>
        </form>

        <div class="auth-footer mt-25 text-center">
            <p>Already registered? <a href="{{ url_for('login') }}" class="text-cyan">Sign In here</a></p>
        </div>
    </div>
</div>
{% endblock %}
