<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report Scam - Cyber Shield</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🛡️ Cyber Shield
    </div>

    <div class="nav-links">

        <a href="/">Home</a>
        <a href="/url-checker">URL Scanner</a>
        <a href="/message-checker">Message Scanner</a>
        <a href="/awareness">Awareness</a>
        <a href="/reports">View Reports</a>

    </div>

</nav>


<main class="container">

    <div class="scanner-box">

        <p class="small-title">
            COMMUNITY SAFETY
        </p>

        <h1>
            🚨 Report a Scam
        </h1>

        <p>
            Report a suspicious scam to help
            other users become aware of it.
        </p>


        <form method="POST">

            <label>
                Scam Type
            </label>

            <select name="scam_type" required>

                <option value="">
                    Select scam type
                </option>

                <option value="Phishing">
                    Phishing
                </option>

                <option value="OTP Scam">
                    OTP Scam
                </option>

                <option value="Banking Scam">
                    Banking Scam
                </option>

                <option value="Fake Job">
                    Fake Job
                </option>

                <option value="Online Shopping Scam">
                    Online Shopping Scam
                </option>

                <option value="Investment Scam">
                    Investment Scam
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>
                Scam Description
            </label>

            <textarea
                name="description"
                placeholder="Describe what happened..."
                required
            ></textarea>


            <label>
                Contact / Website (Optional)
            </label>

            <input
                type="text"
                name="contact"
                placeholder="Phone number, URL or other information"
            >


            <button type="submit">
                Submit Scam Report
            </button>

        </form>

    </div>

</main>

</body>

</html>
